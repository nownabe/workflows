name: oxlint

on:
  workflow_call:

permissions: {}

jobs:
  oxlint:
    name: oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=oxlint
      OXLINT_VERSION: "1.77.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # oxlint-action always fetches the PR base branch inside the action
          # on pull_request events; that fetch needs the checkout credentials
          # on private caller repos. Excluded from ghalint in ghalint.yaml.
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Run oxlint
        uses: oxc-project/oxlint-action@b78c21302e4bc637e83927135c35a6684de1053e # v3.1.0
        with:
          version: ${{ env.OXLINT_VERSION }}
          # Lint the whole tree, matching the previous plain `oxlint` run.
          all-files: true
