name: Renovate Config

on:
  workflow_call:

permissions: {}

jobs:
  renovate-config-validator:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Kept in the `npm:<pkg>@<version>` shape the repo's customManager matches,
      # even though npx takes the bare `<pkg>@<version>`.
      TOOL: npm:renovate@44.93.6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run renovate-config-validator
        # Renovate documents npx as the way to run the validator, and npx needs no
        # setup on the runner. Not mise like the other tool jobs: its npm backend
        # installs via aube, whose trust policy rejects renovate's dependency tree
        # over a provenance downgrade in @yarnpkg/libzip, and the exclusion knob
        # (trust_policy_excludes) exists only as a mise.toml per-tool option —
        # which this workflow deliberately avoids so callers' mise config can't
        # interfere.
        run: npx --yes --package "${TOOL#npm:}" -- renovate-config-validator --strict
