name: oxfmt

on:
  workflow_call:

permissions: {}

jobs:
  oxfmt:
    name: oxfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=oxfmt
      OXFMT_VERSION: "0.62.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # oxfmt-action always fetches the PR base branch inside the action
          # on pull_request events; that fetch needs the checkout credentials
          # on private caller repos. Excluded from ghalint in ghalint.yaml.
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Check formatting
        uses: oxc-project/oxfmt-action@5f25fc2dccfa7335bc29ceceecc610d8b5c93d64 # v0.0.1
        with:
          version: ${{ env.OXFMT_VERSION }}
          # Check the whole tree, matching the previous plain `oxfmt --check`.
          all-files: true
