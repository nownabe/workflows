name: oxfmt

on:
  workflow_call:

permissions: {}

jobs:
  oxfmt:
    name: oxfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TOOL: npm:oxfmt@0.68.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check formatting
        # Run on the runner's preinstalled Node rather than through mise: mise would read
        # the caller's mise.toml, and a pinned node there blocks installing the npm tool.
        run: npx --yes "${TOOL#npm:}" --check
