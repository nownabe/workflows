name: GitHub Workflow

on:
  workflow_call:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TOOL: aqua:rhysd/actionlint@1.7.12
      # Ignore the caller repo's locked/lockfile mise settings; the tool version is pinned in TOOL.
      MISE_LOCKED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4 # renovate:mise-version
          # mise-action forces `mise install --locked` when the caller repo has a mise.lock,
          # which fails if TOOL is not in that lockfile. Skip its install; `mise x` below
          # installs the pinned TOOL and respects MISE_LOCKED=0.
          install: false
      - name: Run actionlint
        # shellcheck is preinstalled on the runner and used for embedded run scripts.
        # mise x pins the tool version without requiring it in the caller's mise config.
        # actionlint predates GitHub's `$/` self-repository `uses:` syntax (2026-07), which
        # zizmor's self-repository audit requires, so ignore only the messages that quote
        # a `$/...` value. Drop the -ignore once rhysd/actionlint#711 ships.
        env:
          # mise-action v5 keeps its token to itself; scope one to the step that installs TOOL.
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise x "$TOOL" -- actionlint -color -ignore '"\$/'

  ghalint:
    name: ghalint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TOOL: aqua:suzuki-shunsuke/ghalint@1.6.0
      # Ignore the caller repo's locked/lockfile mise settings; the tool version is pinned in TOOL.
      MISE_LOCKED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4 # renovate:mise-version
          # mise-action forces `mise install --locked` when the caller repo has a mise.lock,
          # which fails if TOOL is not in that lockfile. Skip its install; `mise x` below
          # installs the pinned TOOL and respects MISE_LOCKED=0.
          install: false
      - name: Run ghalint
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise x "$TOOL" -- ghalint run

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          inputs: .github/workflows
          # SARIF upload requires GitHub Advanced Security and
          # security-events: write permission; emit annotations instead.
          advanced-security: false
          annotations: true
