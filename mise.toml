[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:suzuki-shunsuke/ghalint" = "1.6.0"
"aqua:zizmorcore/zizmor" = "1.33.1"
"aqua:betterleaks/betterleaks" = "1.10.1"
"aqua:trufflesecurity/trufflehog" = "3.100.0"
"aqua:nodejs/node" = "24.22.3" # runtime for the npm-backed tools below
# aqua has native binaries (oxc apps_v) but our pinned mise's baked registry can't resolve them yet, so use npm
"npm:oxlint" = "1.94.0"
"npm:oxfmt" = "0.79.0"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"
